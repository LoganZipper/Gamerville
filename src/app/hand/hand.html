<div class="hand" [id]="playerType === PlayerType.POV ? 'pov' : 'opponent'">
    <app-card
    *ngFor="let card of ui_hand; let i = index; let c = count"
    [uiCard]="card"
    [gameCard]="card.gameCard"
    [positionInfo]="{i,c}"
    [isPlayer]="playerType === PlayerType.POV"
    (click)="playerType === PlayerType.POV && selectCard(card.gameCard)"></app-card>
</div>
